[project]
authors = [{ name = "lorenzo", email = "lorenzo.cerrone@uzh.ch" }]
dependencies = [
    "pydantic",
    "fastapi",
    "uvicorn[standard]",
    "ngio",
    "polars",
    "certifi",
]
name = "fractal-lite"
requires-python = ">= 3.11"
version = "0.1.0"
description = "FastAPI + Svelte desktop port of the Fractal Tasks Sandbox."

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-cov", "httpx"]
# Pinned: these end up in the packaged Electron app (see electron/scripts/build-backend.sh).
build = ["pyinstaller==6.22.3", "websockets==17.3"]
# Optional native desktop window (backend/shell.py), for running everything locally
# without Electron. Not needed by the packaged Electron app.
# On Linux, pywebview also needs Qt to draw the window.
gui = [
    "pywebview; sys_platform != 'linux'",
    "pywebview[qt]; sys_platform == 'linux'",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/fractal_lite"]

# https://docs.astral.sh/ruff
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
pydocstyle = { convention = "google" }
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# B008: FastAPI's `Depends(...)` in argument defaults is the idiomatic pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S"]

[tool.ty.environment]
python = ".pixi/envs/dev"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
# Python version bundled into the packaged Electron app by PyInstaller.
python = "3.13.*"


[tool.pixi.pypi-dependencies]
fractal_lite = { path = ".", editable = true }


[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
gui = { features = ["gui"], solve-group = "default" }

[tool.pixi.tasks]
# Run the API server alone (serves the built frontend if present).
serve = "uvicorn backend.main:app --host 127.0.0.1 --port 8765"
# Clone fractal-web at the pinned tag into the repo root (idempotent).
clone-fractal-web = { cmd = "git clone --branch v1.30.0-a2 --depth 1 https://github.com/fractal-analytics-platform/fractal-web.git fractal-web-clone || echo 'fractal-web-clone already exists, skipping'" }
# Install JS deps and build the static SvelteKit app.
build-frontend = { cmd = "npm install && npm run build", cwd = "src/frontend" }

[tool.pixi.feature.dev.tasks]
test = "pytest"
test-fast = "pytest -m 'not e2e'"
lint = "ruff check ."

[tool.pixi.feature.gui.tasks]
# Launch the native desktop app (pywebview window instead of Electron).
app = "python -m backend.shell"

# On Linux, use the Qt backend directly (pywebview would try GTK first, which is not
# installed) and render without the GPU: Qt WebEngine's GPU compositing shows a blank
# window on some setups (e.g. Wayland: "Backend texture is not a Vulkan texture").
[tool.pixi.feature.gui.target.linux-64.tasks]
app = { cmd = "python -m backend.shell", env = { PYWEBVIEW_GUI = "qt", QTWEBENGINE_CHROMIUM_FLAGS = "--disable-gpu" } }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: slow end-to-end tests that build task pixi environments"]

