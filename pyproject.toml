[project]
authors = [{ name = "lorenzo", email = "lorenzo.cerrone@uzh.ch" }]
dependencies = [
    "pydantic",
    "fastapi",
    "uvicorn",
    "pywebview",
    "ngio",
    "polars",

]
name = "fractal-lite"
requires-python = ">= 3.11"
version = "0.1.0"
description = "FastAPI + Svelte desktop port of the Fractal Tasks Sandbox."

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-cov", "httpx"]
build = ["pyinstaller"]

[project.scripts]
# Launch the native desktop window (uvicorn in a thread + pywebview).
fractal-lite-app = "backend.shell:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/fractal_lite"]

# https://docs.astral.sh/ruff
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
pydocstyle = { convention = "google" }
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# B008: FastAPI's `Depends(...)` in argument defaults is the idiomatic pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S"]

[tool.ty.environment]
python = ".pixi/envs/dev"
